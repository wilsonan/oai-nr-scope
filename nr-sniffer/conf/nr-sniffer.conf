# Example nr-sniffer settings. Pass with -O, or give each option on the command line as --sniffer.<name>.
sniffer = {
  out_dir   = "./sniffer-logs";   # CSV/XML output directory
  passive   = 1;                  # 1: never start random access (keep this on)
  pci       = -1;                 # only log this PCI (-1: any)
  mcs_table = "qam256";           # for a known configuration (M3); a followed UE's table comes from its RRCSetup
  dump_xml  = 1;                  # write each new SIB1 as ASN.1 XER
  follow_ue = 1;                  # follow UEs seen in random access and log their DCIs (dci.csv)
  max_ues   = 8;                  # at most this many at once (1..14), one shadow MAC instance each
  ue_timeout = 10.0;              # stop following a UE after this many seconds without a DCI (0: never)
  merge_pdcch = 1;                # decode search spaces shared by the followed UEs once
  # cellgroup_file = "cellgroup_1a2b_0.uper";  # follow a UE with a known CellGroupConfig (nr-gnb-dci-logger -c)
  # rnti = 0x1a2b;                             # its C-RNTI
};
