# Example nr-sniffer settings. Pass with -O, or give each option on the command line as --sniffer.<name>.
sniffer = {
  out_dir   = "./sniffer-logs";   # CSV/XML output directory
  passive   = 1;                  # 1: never start random access (keep this on)
  pci       = -1;                 # only log this PCI (-1: any)
  mcs_table = "qam256";           # qam256 or qam64 (OAI default gNB configs use qam256 only if enabled)
  dump_xml  = 1;                  # write each new SIB1 as ASN.1 XER
};
